[workspace]
members = ["crates/*"]
default-members = ["crates/oneo-gpui-graph"]
resolver = "3"

[workspace.package]
license = "MIT"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
gpui-kit = "0.7.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
